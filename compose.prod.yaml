services:
  golf:
    image: ${GOLF_IMAGE:-ghcr.io/frankp/golf-handicap:latest}
    build:
      context: .
      dockerfile: Dockerfile
    container_name: golf-ledger
    restart: unless-stopped
    environment:
      GOLF_ADDR: ":8080"
      GOLF_DB: "${GOLF_DB:-/data/golf.db}"
      GOLF_STATIC: "/app/web/dist"
      PUID: "${PUID:-99}"
      PGID: "${PGID:-100}"
      TZ: "${TZ:-Australia/Melbourne}"
    ports:
      - "${GOLF_PORT:-8080}:8080"
    volumes:
      - "${GOLF_DATA_DIR:-./data}:/data"
    read_only: true
    tmpfs:
      - /tmp:size=16m,mode=1777
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    cap_add:
      - SETGID
      - SETUID
